<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Трекер жизни</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #e0e0e0;
    }
    .info {
      flex: 1;
    }
    .name {
      font-size: 18px;
      font-weight: 600;
    }
    .id {
      font-size: 14px;
      color: #888;
    }
    .placeholder {
      font-style: italic;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="header">
    <img id="avatar" class="avatar" src="" alt="Аватар" />
    <div class="info">
      <div id="name" class="name">Загрузка...</div>
      <div id="user-id" class="id">ID: —</div>
    </div>
  </div>

  <h2>Привет! Это твой трекер жизни</h2>
  <p>Пока здесь пусто, но скоро появятся привычки, цели и прогресс.</p>

  <script>
    // Ждём, пока Telegram.WebApp загрузится
    window.addEventListener('load', () => {
      if (window.Telegram?.WebApp) {
        const tg = window.Telegram.WebApp;
        
        tg.ready();           // обязательно сообщаем, что готовы
        tg.expand();          // разворачиваем на весь экран
        // tg.enableClosingConfirmation(); // опционально

        const user = tg.initDataUnsafe?.user;

        if (user) {
          // Имя
          document.getElementById('name').textContent = 
            user.first_name + (user.last_name ? ' ' + user.last_name : '');

          // ID
          document.getElementById('user-id').textContent = 'ID: ' + user.id;

          // Аватар (если пришёл)
          const avatarImg = document.getElementById('avatar');
          if (user.photo_url) {
            avatarImg.src = user.photo_url;
            avatarImg.onerror = () => {
              avatarImg.src = 'https://t.me/i/userpic/320/default_avatar.jpg'; // запасная заглушка
            };
          } else {
            // Если фото нет — дефолтная круглая заглушка Telegram
            avatarImg.src = 'https://t.me/i/userpic/320/default_avatar.jpg';
            // или любая другая: 'https://via.placeholder.com/48?text=' + user.first_name[0]
          }
        } else {
          document.getElementById('name').textContent = 'Пользователь не определён';
          document.getElementById('user-id').textContent = 'ID: —';
          document.getElementById('avatar').src = 'https://t.me/i/userpic/320/default_avatar.jpg';
        }

        // Автоматическая адаптация под тему Telegram (очень рекомендуется)
        document.body.style.background = tg.themeParams.bg_color || '#ffffff';
        document.body.style.color = tg.themeParams.text_color || '#000000';
      } else {
        document.getElementById('name').textContent = 'Это не Telegram Web App';
      }
    });
  </script>

</body>
</html>
