<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер жизни</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    <body>

  <!-- Профиль -->
  <div class="profile">
    <img id="avatar" class="avatar" src="" alt="Аватар">
    <div>
      <div id="fullname" class="name">Загрузка...</div>
      <div id="userid" class="id">ID: —</div>
    </div>
  </div>

  <!-- Основной контент -->
  <div class="container">

    <!-- Вкладка Привычки -->
    <div id="habits" class="tab-content active">
      <div class="tab-header">
        <h2>Привычки</h2>
        <button id="add-habit-btn" class="add-btn">+</button>
      </div>

      <div id="habits-list" class="habits-list">
        <!-- сюда будут добавляться карточки привычек -->
      </div>

      <div id="no-habits" class="empty-state">
        Пока нет привычек<br>Нажми «+», чтобы добавить первую
      </div>
    </div>

    <!-- остальные вкладки остаются как были -->
    <div id="tasks" class="tab-content">...</div>
    <div id="schedule" class="tab-content">...</div>
    <div id="progress" class="tab-content">...</div>

  </div>

  <!-- Нижняя панель вкладок (без изменений) -->
  <div class="tab-bar">
    <!-- ... как было ... -->
  </div>

  <!-- Модальное окно для добавления привычки -->
  <div id="add-habit-modal" class="modal">
    <div class="modal-content">
      <h3>Новая привычка</h3>
      <input type="text" id="habit-name" placeholder="Например: Пить 2 л воды" autocomplete="off">
      <div class="modal-buttons">
        <button id="cancel-habit">Отмена</button>
        <button id="save-habit">Добавить</button>
      </div>
    </div>
  </div>

  <script>
    // ──────────────────────────────────────────────
    // 1. Загрузка Telegram + профиль (как было)
    // ──────────────────────────────────────────────
    window.addEventListener('load', function() {
      if (!window.Telegram?.WebApp) {
        document.getElementById('fullname').textContent = 'Не Telegram';
        return;
      }

      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      if (tg.themeParams) {
        document.body.style.background = tg.themeParams.bg_color || '#f0f2f5';
        document.body.style.color = tg.themeParams.text_color || '#1d1d1f';
      }

      const user = tg.initDataUnsafe?.user;
      if (user) {
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ');
        document.getElementById('fullname').textContent = fullName || 'Без имени';
        document.getElementById('userid').textContent = 'ID: ' + user.id;
        document.getElementById('avatar').src = user.photo_url || 'https://t.me/i/userpic/320/default_avatar.jpg';
      }

      // ──────────────────────────────────────────────
      // 2. Логика вкладок (как было)
      // ──────────────────────────────────────────────
      const tabs = document.querySelectorAll('.tab-item');
      const contents = document.querySelectorAll('.tab-content');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          contents.forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.getAttribute('data-tab')).classList.add('active');
        });
      });

      // ──────────────────────────────────────────────
      // 3. Работа с привычками (новое)
      // ──────────────────────────────────────────────
      let habits = JSON.parse(localStorage.getItem('habits') || '[]');

      const habitsList = document.getElementById('habits-list');
      const noHabits = document.getElementById('no-habits');
      const addBtn = document.getElementById('add-habit-btn');
      const modal = document.getElementById('add-habit-modal');
      const habitInput = document.getElementById('habit-name');
      const saveBtn = document.getElementById('save-habit');
      const cancelBtn = document.getElementById('cancel-habit');

      function renderHabits() {
        habitsList.innerHTML = '';
        if (habits.length === 0) {
          noHabits.style.display = 'block';
        } else {
          noHabits.style.display = 'none';
          habits.forEach(habit => {
            const div = document.createElement('div');
            div.className = 'habit-item';
            div.innerHTML = `
              <div class="habit-name">${habit.name}</div>
              <div class="habit-streak">Стрик: ${habit.streak || 0} дн</div>
            `;
            habitsList.appendChild(div);
          });
        }
      }

      function saveHabits() {
        localStorage.setItem('habits', JSON.stringify(habits));
      }

      // Показать модалку
      addBtn.addEventListener('click', () => {
        modal.style.display = 'flex';
        habitInput.value = '';
        habitInput.focus();
      });

      // Закрыть модалку
      cancelBtn.addEventListener('click', () => {
        modal.style.display = 'none';
      });

      // Сохранить привычку
      saveBtn.addEventListener('click', () => {
        const name = habitInput.value.trim();
        if (name) {
          habits.push({
            id: Date.now(),
            name: name,
            streak: 0,
            created: new Date().toISOString()
          });
          saveHabits();
          renderHabits();
          modal.style.display = 'none';
        }
      });

      // Закрытие по клику вне модалки
      modal.addEventListener('click', e => {
        if (e.target === modal) modal.style.display = 'none';
      });

      // Первая отрисовка
      renderHabits();
    });
  </script>
</body>

  <!-- Профиль вверху -->
  <div class="profile">
    <img id="avatar" class="avatar" src="" alt="Аватар">
    <div>
      <div id="fullname" class="name">Загрузка...</div>
      <div id="userid" class="id">ID: —</div>
    </div>
  </div>

  <!-- Основной контент -->
  <div class="container">

    <!-- Вкладка Привычки -->
    <div id="habits" class="tab-content active">
      <h2>Привычки</h2>
      <div class="empty-state">
        Пока нет привычек<br>Нажми «+» внизу, чтобы добавить первую
      </div>
    </div>

    <!-- Вкладка Задания на день -->
    <div id="tasks" class="tab-content">
      <h2>Задания на день</h2>
      <div class="empty-state">
        Сегодня задач нет<br>Добавь задачи на текущий день
      </div>
    </div>

    <!-- Вкладка Расписание -->
    <div id="schedule" class="tab-content">
      <h2>Расписание</h2>
      <div class="empty-state">
        Расписание пустое<br>Запланируй дела на день или неделю
      </div>
    </div>

    <!-- Вкладка Прогресс -->
    <div id="progress" class="tab-content">
      <h2>Прогресс</h2>
      <div class="empty-state">
        Пока нет данных<br>Отмечай привычки и задачи — здесь появится статистика
      </div>
    </div>

  </div>

  <!-- Нижняя панель вкладок -->
  <div class="tab-bar">
    <div class="tab-item active" data-tab="habits">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Привычки</span>
    </div>

    <div class="tab-item" data-tab="tasks">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Задания</span>
    </div>

    <div class="tab-item" data-tab="schedule">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Расписание</span>
    </div>

    <div class="tab-item" data-tab="progress">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span>Прогресс</span>
    </div>
  </div>

  <script>
    window.addEventListener('load', function() {
      if (!window.Telegram?.WebApp) {
        document.getElementById('fullname').textContent = 'Не Telegram';
        return;
      }

      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      // Адаптация под тему Telegram (очень рекомендуется)
      if (tg.themeParams) {
        document.body.style.background = tg.themeParams.bg_color || '#f0f2f5';
        document.body.style.color = tg.themeParams.text_color || '#1d1d1f';
      }

      const user = tg.initDataUnsafe?.user;

      if (user) {
        const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ');
        document.getElementById('fullname').textContent = fullName || 'Без имени';
        document.getElementById('userid').textContent = 'ID: ' + user.id;

        const avatar = document.getElementById('avatar');
        avatar.src = user.photo_url || 'https://t.me/i/userpic/320/default_avatar.jpg';
      }

      // Логика переключения вкладок
      const tabs = document.querySelectorAll('.tab-item');
      const contents = document.querySelectorAll('.tab-content');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          // Убираем active со всех
          tabs.forEach(t => t.classList.remove('active'));
          contents.forEach(c => c.classList.remove('active'));

          // Добавляем active выбранной
          tab.classList.add('active');
          const tabId = tab.getAttribute('data-tab');
          document.getElementById(tabId).classList.add('active');
        });
      });
    });
  </script>

</body>
</html>
  </script>

</body>
</html>
