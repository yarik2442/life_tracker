<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер жизни</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- Контейнер вкладок -->
  <div class="container">

    <!-- Вкладка "Текущие" -->
    <div id="current" class="tab-content active">
      <!-- Сюда будет вставляться профиль из js/current.js -->
    </div>

    <!-- Вкладка "Задания" -->
    <div id="tasks" class="tab-content">
      <div class="tab-header">
        <h2>Задания на сегодня</h2>
        <button id="add-task-btn" class="add-btn">+</button>
      </div>

      <div id="tasks-list" class="tasks-list"></div>

      <div id="no-tasks" class="empty-state">
        Сегодня задач нет<br>
        Нажми «+», чтобы добавить
      </div>
    </div>

  </div>

  <!-- Таб-бар -->
  <div class="tab-bar">
    <div class="tab-item active" data-tab="current">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Текущие</span>
    </div>

    <div class="tab-item" data-tab="tasks">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Задания</span>
    </div>
  </div>

  <!-- Модалка для задач -->
  <div id="add-task-modal" class="modal">
    <div class="modal-content">
      <h3>Новая задача</h3>
      <input type="text" id="task-name" placeholder="Например: Купить продукты" autocomplete="off">
      <div class="modal-buttons">
        <button id="cancel-task">Отмена</button>
        <button id="save-task">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Подключаем JS -->
  <script src="js/main.js"></script>
  <script src="js/current.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
